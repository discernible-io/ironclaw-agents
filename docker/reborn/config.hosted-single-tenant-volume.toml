api_version = "ironclaw.runtime/v1"

[boot]
profile = "hosted-single-tenant-volume"

[identity]
default_owner = "reborn-cli"
tenant = "reborn-cli"
default_agent = "reborn-cli-agent"

[runner]
heartbeat_interval_secs = 5
poll_interval_ms = 200

[skills]
regex_activation_enabled = true

[webui]
env_token_var = "IRONCLAW_REBORN_WEBUI_TOKEN"
env_user_id_var = "IRONCLAW_REBORN_WEBUI_USER_ID"

[llm.default]
provider_id = "nearai"
model = "deepseek-ai/DeepSeek-V4-Flash"
api_key_env = "NEARAI_API_KEY"

# Preview volume burns model spend quickly; the WebUI "Approve" path for
# BlockedResource currently resumes without raising the USD cap, so hitting
# the default $5/day pause looks like an endless approval loop. Keep a higher
# preview ceiling here (override with IRONCLAW_BUDGET_USER_DAILY_USD).
[budget]
user_daily_usd = 50.0

[slack]
enabled = false
